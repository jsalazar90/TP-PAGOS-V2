<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="TP PAGOS PRO - Sistema Administrativo de Control y Gestión de Pagos (Travel Point)" />
    
    <!-- PWA & Mobile Capabilities -->
    <meta name="application-name" content="TP PAGOS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TP PAGOS" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#0f172a" />
    <meta name="msapplication-tap-highlight" content="no" />

    <title>TP PAGOS PRO - Control de Pagos</title>
    
    <!-- Icons & Favicons for iOS, Android and Windows -->
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Auto-recovery if an outdated Service Worker or cached HTML references stale /assets/* chunks -->
    <script>
      (function () {
        var RELOAD_KEY = 'tp_asset_reload_once';
        window.addEventListener('error', function (event) {
          var target = event && event.target;
          if (!target || (target.tagName !== 'SCRIPT' && target.tagName !== 'LINK')) return;
          var url = target.src || target.href || '';
          if (url.indexOf('/assets/') === -1) return;
          try {
            if (sessionStorage.getItem(RELOAD_KEY) === '1') return;
            sessionStorage.setItem(RELOAD_KEY, '1');
          } catch (e) {}

          var tasks = [];
          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
              }).catch(function () {})
            );
          }
          if ('caches' in window && window.caches.keys) {
            tasks.push(
              window.caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return window.caches.delete(k); }));
              }).catch(function () {})
            );
          }
          Promise.all(tasks).finally(function () {
            window.location.reload();
          });
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
